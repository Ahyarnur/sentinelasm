[project]
name = "sentinelasm-backend"
version = "0.1.0"
description = "SentinelASM - Attack Surface Management backend (FastAPI + Celery)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "celery==5.4.0",
    "redis==5.2.1",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.1",
    "weasyprint==63.1",
    "jinja2==3.1.5",
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

# requirements.txt tetap dipakai untuk build Docker yang ringan.
# pyproject.toml ini menyediakan metadata + konfigurasi tooling (ruff, pytest).

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() sebagai default argument

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
