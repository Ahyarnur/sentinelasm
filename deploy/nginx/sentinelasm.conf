# SentinelASM — reverse proxy (nginx)
# Dipasang di container `nginx` (profile "proxy" di deploy/docker-compose.yml).
#
#   docker compose --profile proxy -f deploy/docker-compose.yml up -d
#
# Lalu akses stack lewat http://localhost:8080
# Untuk HTTPS, tambahkan blok server 443 + sertifikat (lihat docs/deployment.md).

upstream sentinelasm_backend {
    server backend:8000;
}

upstream sentinelasm_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Batasi ukuran upload (dokumen otorisasi, dsb.)
    client_max_body_size 25m;

    # API
    location /api/ {
        proxy_pass         http://sentinelasm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # OpenAPI / Swagger
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass         http://sentinelasm_backend;
        proxy_set_header   Host $host;
    }

    # WebSocket untuk progress scan real-time (rencana PLAN_ASM.md §6)
    location /ws/ {
        proxy_pass         http://sentinelasm_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Frontend dashboard
    location / {
        proxy_pass         http://sentinelasm_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
